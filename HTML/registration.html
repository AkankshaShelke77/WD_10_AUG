<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        fieldset {
        width: 400px;
        margin: 20px auto;
        background-color: rgb(187, 205, 239);
        }
    </style>

</head>
<body>

    <h1 align="center">Registration Form</h1>

    <fieldset>
        <form align="center" action="#">
            <label for="fullname">Full Name</label><br>
            <input type="text" id="fullname" placeholder="Enter Your FullName"><br><br>

            <label for="">Email</label><br>
            <input type="email" id="" placeholder="Enter Your Email"><br><br>

            <label>Password</label><br>
            <input type="password" name="password" placeholder="Enter Password"><br><br>

            <label>Confirm Password</label><br>
            <input type="password" name="password" placeholder="Enter Confirm Password"><br><br>

            <label>Date of Birth</label><br>
            <input type="date" name=""><br><br>

            <label>Phone</label><br>
            <input type="tel" name="phone"><br><br>

            <label>Profile Image</label><br>
            <input type="file" ><br><br>

            <input type="submit" value="Register">
        </form>
    </fieldset>
    
</body>
</html>
