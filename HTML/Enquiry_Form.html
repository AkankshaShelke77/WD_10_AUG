<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enqiry</title>
</head>
<body>

    <fieldset  style="width: 400px; height: 600px;">
        <form action="#" align="center">
            <lable for="fullname" >FullName</lable><br>
            <input type="text" id="fullname" placeholder="Enter Your Name">
            <br><br>

            <lable for="email" > Email </lable><br>
            <input type="email" id="email" placeholder="abc@gmail.com">
            <br><br>

            <lable for="" >Mobile Number</lable><br>
            <input type="tel" id="" placeholder="1238766487">
            <br><br>

            <lable for="" >Age</lable><br>
            <input type="number" id="" >
            <br><br>

            <lable for="" >Qualification</lable><br>
            <select name="Qualification" id="Qualification">
                <option value=""></option>
                <option value="BE/B.TECH">BE/BTECH</option>
                <option value="M.TECH">M.Tech</option>
                <option value="BCS">BCS</option>
                <option value="MCA">MCA</option>
                <option value="MBA">MBA</option>
                <option value="Other">Other</option>
            </select>
            <br><br>

            <lable for="" >Branch</lable><br>
            <select name="branch" id="branch">
                <option value=""></option>
                <option value="Computer">Computer</option>
                <option value="E&TC">E&TC</option>
                <option value="AIDS">AIDS</option>
                <option value="Electrical">Electrical</option>
                <option value="Mechanical">Mechanical</option>
                <option value="Civil">Civil</option>
                <option value="Other">Other</option>

            </select>
            
            <br><br>

            <label >Intrested Course Name</label><br>
            <select name="branch" id="branch">
                <option value="">Select Course Name</option>
                <option value="">Full Stack Java</option>
                <option value="">Full Stack Python</option>
                <option value="">Data Analytics</option>
                <option value="">CyberSecurity</option>
                <option value="">Mern Stack Devloper</option>
                <option value="">Software Testing</option>
                <option value="">Other</option>
            </select>
            <br><br>

            <lable >Mode</lable><br>
            <input type="radio" name="status" value="Offline">Offline<br>
            <input type="radio" name="status" value="Online">Online<br>
            <input type="radio" name="status" value="Hybrid">Hybrid

            <br><br>

            <button type="submit">Submit</button>

        </form>
    </fieldset>
    
</body>
</html>
